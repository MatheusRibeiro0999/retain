<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Retain - Configurações</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

```
<aside class="sidebar">

    <div class="logo">
        <h1>Retain</h1>
        <span>Gestão de Retenção</span>
    </div>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/operators">Operadores</a>
        <a href="/records">Histórico</a>
        <a href="/reports">Relatórios</a>
        <a href="/settings" class="active">Configurações</a>
    </nav>

</aside>


<main class="main">

    <header class="topbar">

        <div>
            <h2>Configurações</h2>
            <p>Configure as metas da operação.</p>
        </div>

    </header>


    <section class="panel">

        <div class="panel-header">

            <div>
                <h3>Metas da operação</h3>
                <p>
                    Defina os parâmetros utilizados pelo Retain.
                </p>
            </div>

        </div>


        <form method="POST" action="/settings">

            <div class="form-group">

                <label for="retention_target">
                    Meta de retenção
                </label>

                <input
                    type="number"
                    id="retention_target"
                    name="retention_target"
                    min="0"
                    max="100"
                    step="0.1"
                    value="{{ setting.retention_target }}"
                    required
                >

                <small>
                    Informe a meta em porcentagem.
                    Ex.: 85,0%
                </small>

            </div>


            <div class="form-actions">

                <a href="/" class="btn-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn-primary">
                    Salvar configurações
                </button>

            </div>

        </form>

    </section>

</main>
```

</body>

</html>
