<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo operador - Retain</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="logo">
                <span>R</span>
                <div>
                    <strong>Retain</strong>
                    <small>Performance</small>
                </div>
            </div>

            <nav>
                <a href="/">Dashboard</a>
                <a href="/operators" class="active">Operadores</a>
                <a href="/records">Histórico</a>
                <a href="/reports">Relatórios</a>
                 <a href="/settings">Configurações</a>
            </nav>
        </aside>


        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Novo operador</h1>
                    <p>Cadastre um novo operador na equipe.</p>
                </div>
            </header>


            <section class="panel">

                <div class="panel-header">
                    <div>
                        <h2>Dados do operador</h2>
                        <p>Preencha as informações abaixo.</p>
                    </div>
                </div>


                <form method="POST" action="/operators/new">

                    <div class="form-group">
                        <label for="name">Nome do operador</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Ex.: Maria Silva"
                        >
                    </div>


                    <div class="form-group">
                        <label for="team">Equipe</label>

                        <select id="team" name="team">
                            <option value="">Selecione a equipe</option>
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                        </select>
                    </div>


                    <div class="form-actions">
                        <a href="/operators" class="btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn-primary">
                            Salvar operador
                        </button>
                    </div>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
